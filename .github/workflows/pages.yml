# Publishes i Court Forms on GitHub Pages:
#   https://mohdrafiqazad-hue.github.io/Court-Forms-By-Azad-Advocate-/
# Only the app files are published (allow-list below), not docs, tests or workflows.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Publish to GitHub Pages

on:
  push:
    branches: [main, ccr-1ddb94dd-s0x9y0]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect the app files
        run: |
          mkdir _site
          cp -r index.html admin.html terms.html privacy.html manifest.webmanifest sw.js css js forms lib icons _site/
          touch _site/.nojekyll
          sed -i "s/^const VERSION = '[^']*';/const VERSION = 'icf-${GITHUB_SHA::8}';/" _site/sw.js
          grep "^const VERSION" _site/sw.js
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
